<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf6fb"><title>My Fish Room</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e7f4fb;background:#071a2a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#082f49,#071a2a 55%);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.shell{max-width:950px;margin:auto;padding:20px 15px 100px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 18px}h1{font-size:26px;margin:0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.sub,.muted{color:#9fb9cb}.sub{font-size:13px}.pill{display:inline-block;border:1px solid #36758d;color:#bdeaff;border-radius:99px;padding:5px 9px;font-size:12px}.nav{display:flex;gap:7px;overflow-x:auto;margin:15px 0 20px;padding-bottom:6px}.nav button{background:#12334a;color:#bdd9e9;border:1px solid #28516a;border-radius:12px;padding:10px 14px;white-space:nowrap}.nav button.active{background:#19a7b7;color:#032331;font-weight:750}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}.panel,.tank{background:#102d40;border:1px solid #25506a;border-radius:16px;padding:15px;box-shadow:0 8px 25px #0002}.tank{display:block;text-align:left;color:inherit;width:100%}.tank:active{transform:scale(.99)}.tankhead{display:flex;justify-content:space-between;align-items:center}.tank .num{font-size:20px;font-weight:750}.tank p{font-size:14px;line-height:1.45;margin:9px 0}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#1b4b5a;color:#b6f4e8}.tag.warn{background:#5d431d;color:#ffe0a7}.tag.off{background:#394755;color:#c7d4df}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 15px}.metric{background:#114159;border-radius:12px;padding:13px}.metric b{display:block;font-size:23px}.metric span{font-size:12px;color:#bdd0dd}label{display:block;font-weight:650;font-size:13px;margin:12px 0 5px}input,select,textarea{width:100%;border-radius:10px;background:#082438;border:1px solid #356077;color:#f2faff;padding:12px;outline-color:#29bbc5}textarea{min-height:75px}.action{background:#19a7b7;color:#022b37;padding:11px 15px;border-radius:11px;font-weight:750}.secondary{background:#244d65;color:#e8f7ff;padding:11px 14px;border-radius:11px}.danger{background:#6a3440;color:#ffe4e6;padding:11px 14px;border-radius:11px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.small{font-size:12px}.listrow{padding:12px 0;border-bottom:1px solid #2b4b60}.listrow:last-child{border:0}.hidden{display:none!important}.back{background:none;color:#9de6ed;padding:6px 0}.hint{font-size:13px;color:#a9becd;line-height:1.5}.notice{border-left:3px solid #40c6be;background:#154253;padding:12px;border-radius:8px;font-size:13px;line-height:1.5;margin:12px 0}.warning{border-left-color:#f7bd69}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:470px){.metrics{grid-template-columns:repeat(3,1fr)}.metric{padding:10px}.metric b{font-size:19px}.two{grid-template-columns:1fr}header h1{font-size:23px}}.floatmic{position:fixed;right:19px;bottom:20px;border-radius:50%;background:#35ced0;color:#062736;width:60px;height:60px;font-size:25px;box-shadow:0 5px 25px #0008}.floatmic.on{background:#ffbb69}.toast{position:fixed;bottom:92px;left:15px;right:15px;max-width:520px;margin:auto;background:#ecfbff;color:#053243;padding:14px;border-radius:12px;box-shadow:0 8px 35px #0008;z-index:9}.empty{color:#a6bdcb;padding:15px 4px}a{color:#80ebec}

/* Clear, simplified phone-friendly layout */
:root{color:#183a4b;background:#f2f8fb}body{background:linear-gradient(180deg,#e6f6fa,#f5fafb 35%);color:#183a4b}.shell{max-width:1000px;padding:16px 14px 95px}header{background:#ffffffcc;border:1px solid #d8e9ef;border-radius:18px;padding:16px;box-shadow:0 4px 16px #19465e0b}header h1{font-size:24px}.sub,.muted{color:#587786}.pill{color:#176879;border-color:#b5dde4;background:#e9f9fc}.nav{gap:7px;margin:14px 0 17px}.nav button{background:#fff;color:#426676;border:1px solid #d5e5ea;font-size:13px;padding:10px 12px}.nav button.active{background:#117f93;color:white;border-color:#117f93}.panel,.tank{background:#fff;border:1px solid #d5e5ea;box-shadow:0 4px 15px #164a5b0c}.metric{background:white;border:1px solid #d6e8ec;padding:11px}.metric b{color:#117f93}.metric span{color:#587786}.tag{background:#e0f6ef;color:#13785c}.tag.warn{background:#fff3de;color:#95600d}.tag.off{background:#edf0f3;color:#697987}.tank{padding:0;overflow:hidden}.tankhead{padding:12px 13px 0}.tank .num{font-size:15px}.tank h3{font-size:14px;margin:9px 13px 3px}.tank .sub{font-size:11px;margin:0 13px 10px}.tank p{color:#476776;font-size:12px;margin:10px 13px 14px}.tank-water{height:49px;background:linear-gradient(180deg,#e4f7fa 0%,#b4e5ec 100%);position:relative;overflow:hidden;border-top:2px solid #8ccbd5;border-bottom:2px solid #88cbd7}.tank-water:before{content:' ';position:absolute;inset:6px 0 auto;height:1px;background:#ffffff99}.tank-water:after{content:'🐟  🫧  🐠';position:absolute;left:12%;top:12px;letter-spacing:8px;font-size:17px;white-space:nowrap}.tank-water.empty-water{background:#f1f5f6;border-color:#d7e3e7}.tank-water.empty-water:after{content:' ';}.tank-water.planned-water{background:repeating-linear-gradient(45deg,#f1f4f6,#f1f4f6 12px,#e8eef1 12px,#e8eef1 24px);border-color:#d7e3e7}.tank-water.planned-water:after{content:' '}.overview-head{margin:4px 0 13px}.overview-head h2{margin-bottom:4px;font-size:20px}.overview-head .hint{margin:0}.tank-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tank-grid .tank{min-width:0}.tank-grid .tankhead{gap:5px}.tank-grid .tag{font-size:10px;padding:4px 6px}.tank-grid .tank p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}.tank-grid .tank .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rack-label{font-size:13px;font-weight:700;color:#3e7888;letter-spacing:.02em;margin:17px 0 9px}.rack{padding:10px;background:#dceaf0;border:1px solid #cbdde4;border-radius:16px}.rack .tank-grid{gap:8px}.rack-foot{height:8px;border-radius:3px;background:#8caab8;margin:8px 5px 1px}.action{background:#117f93;color:white}.secondary{background:#e5f4f8;color:#176477}.danger{background:#fce6e6;color:#9c3434}.back{color:#117f93}.hint{color:#647f8c}.notice{background:#e7f7f8}.listrow{border-color:#e2eef1}input,select,textarea{background:#f7fbfc;border-color:#bcd4df;color:#193f51}.floatmic{background:#117f93;color:#fff}.toast{background:#fff;color:#193f51}.empty{color:#7d95a0}a{color:#117f93}
@media(max-width:650px){.tank-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tank-grid .tank h3{min-height:34px}.tank-grid .tankhead{flex-wrap:wrap}.metrics{gap:6px}.metric b{font-size:20px}.metric span{font-size:10px}}
@media(max-width:370px){.tank-grid{gap:7px}.tank-grid .tankhead{padding:10px 9px 0}.tank-grid .tank h3,.tank-grid .tank .sub,.tank-grid .tank p{margin-left:9px;margin-right:9px}}
 .layout-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:12px}.layout-panel{margin-top:12px}.layout-canvas{position:relative;height:270px;border-radius:12px;background:repeating-linear-gradient(0deg,#dfc6a3 0 2px,#ead4b6 3px 28px);border:2px solid #8e7557;overflow:hidden}.layout-tank{position:absolute;height:21%;border:3px solid #1b5269;border-radius:5px;color:#102b3c;z-index:2;display:flex;justify-content:center;align-items:center;padding:0;box-shadow:inset 0 0 0 3px #ffffff55}.layout-tank b{font-size:27px;text-shadow:1px 1px #fff}.layout-dividers{position:absolute;inset:0;pointer-events:none;opacity:.55}.layout-beam{position:absolute;background:#a8753d;border:2px solid #6b4726;z-index:1;cursor:pointer}.layout-canvas.editing .layout-tank,.layout-canvas.editing .layout-beam{touch-action:none;cursor:grab}.layout-canvas.editing .layout-tank:active,.layout-canvas.editing .layout-beam:active{cursor:grabbing}.layout-trash{border:2px dashed #d66;padding:13px;border-radius:10px;text-align:center;background:#fee2e2;color:#8b1616;margin-top:10px}.layout-butt{position:absolute;right:2%;bottom:2%;width:16%;height:37%;border-radius:22% 22% 12% 12%;background:#303d43;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:23px}.layout-butt small{font-size:10px} 
</style><style id="lock-style">#fish-lock{position:fixed;inset:0;z-index:99999;background:linear-gradient(160deg,#e6f6fa,#f5fafb);display:flex;align-items:center;justify-content:center;padding:20px;color:#183a4b}#fish-lock .lock-card{width:100%;max-width:390px;background:white;border:1px solid #d5e5ea;border-radius:20px;padding:25px;box-shadow:0 10px 30px #164a5b20;text-align:center}#fish-lock input{margin:12px 0;background:#f7fbfc;color:#193f51}#fish-lock button{width:100%;padding:13px;border-radius:11px;background:#117f93;color:white;font-weight:700}#fish-lock .lock-error{min-height:20px;color:#b43d3d;font-size:13px}</style></head><body><div id="fish-lock"><form class="lock-card" id="fish-lock-form"><h1>🐠 My Fish Room</h1><p>🔒 Enter your password to open the app.</p><input id="fish-lock-password" type="password" placeholder="Password" autocomplete="off" required aria-label="Password"><button type="submit">Unlock Fish Room</button><p class="lock-error" id="fish-lock-error" role="alert"></p></form></div><main class="shell"><header><div><h1>🐠 My Fish Room</h1><div class="sub">Tank care • Breeding • Water tests</div></div><span class="pill">18 tanks</span></header><div class="nav" id="nav"></div><div id="view"></div></main><button class="floatmic" id="mic" title="Speak an instruction" aria-label="Speak an instruction">🎙️</button><div id="toast" class="toast hidden"></div><script>
const KEY='myfishroom_v1';const today=()=>new Date().toISOString().slice(0,10);
const seedTanks=[
[1,'Grow-out','600 × 600 × 600',216,'active','~170 juvenile common and albino bristlenose plecos (20–70 mm); ~13 baby mollies'],
[2,'Lightning blue acaras','360 × 400 × 300',43.2,'active','1 adult male and 1 adult female; breeding pair not yet established'],
[3,'Angelfish grow-out','360 × 400 × 300',43.2,'active','5 baby angelfish (~15 mm), offspring of Tank 11 pair'],
[4,'Shrimp colony','600 × 300 × 300',54,'active','Blue and yellow shrimp; ramshorn snails (quantities not tracked)'],
[5,'L519 breeding','300 × 300 × 300',27,'active','Honeycomb bristlenose L519 established male/female breeding pair'],
[6,'Bristlenose fry','300 × 300 × 300',27,'active','24 baby bristlenose plecos; approximately 20 mm'],
[7,'Albino bristlenose pair','300 × 300 × 300',27,'active','Male and female albino bristlenose; breeding pair not yet established'],
[8,'Bristlenose pair','',null,'active','Male and female bristlenose; eggs laid 3 October 2026'],
[9,'Molly fry','430 × 340 × 300',43.86,'active','Baby mollies, approximately 8–25 mm; spawning date unknown'],
[10,'Polar blue parrots','430 × 340 × 300',43.86,'active','2 growing polar blue parrots, possibly both female'],
[11,'Breeding angelfish','300 × 300 × 380',34.2,'active','Male and female proven breeding pair; parents of Tank 3 fry'],
[12,'Empty','300 × 300 × 380',34.2,'empty','No livestock recorded'],
[13,'Empty','300 × 300 × 380',34.2,'empty','No livestock recorded'],
[14,'Empty','360 × 1200 × 300',129.6,'empty','No livestock recorded'],
[15,'Not set up','',null,'planned','Not yet set up'],[16,'Not set up','',null,'planned','Not yet set up'],[17,'Not set up','',null,'planned','Not yet set up'],[18,'Not set up','',null,'planned','Not yet set up']
].map(([id,name,dimensions,litres,status,stock])=>({id,name,dimensions,litres,status,stock,notes:''}));
const initial=()=>({version:1,tanks:seedTanks,breeding:[{tank:6,date:'2026-10-03',type:'Eggs laid',notes:'Batch now counted at 24 fry; current fry around 20 mm'},{tank:6,date:'2026-10-09',type:'Wrigglers',notes:'Same batch'},{tank:6,date:today(),type:'Fry count',notes:'24 baby bristlenose counted'},{tank:8,date:'2026-10-03',type:'Eggs laid',notes:''},{tank:11,date:'',type:'Unsuccessful batch',notes:'Eggs not fertilised; date uncertain, possibly October 2026'},{tank:11,date:'',type:'Unsuccessful batch',notes:'Eggs eaten; date uncertain, possibly 7 October 2026'},{tank:11,date:'',type:'Successful batch',notes:'Five fry currently in Tank 3; exact spawn date not supplied'}],tests:[],maintenance:[],settings:{voiceReply:true},reservoir:{diameter:550,height:900,capacity:214,level:646,volume:153,notes:'Permanent unheated tap-water reservoir; Seachem Prime and wavemaker. Values approximate.'}});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()};if(!Array.isArray(db.tanks))db=initial();const stockDefaults=[['Common Bristlenose',3],['Albino Bristlenose',3.5],['Super Red Bristlenose',5],['L519 Honeycomb',20],['Lightning Blue Acara',4],['Angelfish',3],['Mollies',1],['Blue Dream Shrimp',1],['Polar Blue Parrot',3],['Yellow Shrimp',1]];
if(!Array.isArray(db.stockItems))db.stockItems=stockDefaults.map(([name,price])=>({name,price,qty:0}));
// Structured saleable livestock is recorded against each tank; old descriptions are retained internally for backup compatibility.
db.tanks.forEach(t=>{if(!t.saleCounts||typeof t.saleCounts!=='object')t.saleCounts={};});
let tab='tanks',selected=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch{toast('Device storage unavailable: please export a backup.')}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(window._to);window._to=setTimeout(()=>el.classList.add('hidden'),4500)}
function say(s){toast(s);if(db.settings.voiceReply&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=1;speechSynthesis.speak(u)}}
const btn=(label,fn,cl='secondary')=>`<button class="${cl}" onclick="${fn}">${label}</button>`;
function render(){document.getElementById('nav').innerHTML=[['tanks','🏠 Tanks'],['stock','💷 Stock Value'],['breeding','🥚 Breeding'],['tests','🧪 Water tests'],['maintenance','🧽 Maintenance'],['layout','🗺️ 2D Layout'],['commands','🎙️ Commands'],['settings','⚙️ Settings']].map(([k,n])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${n}</button>`).join('');const v=document.getElementById('view');v.innerHTML=selected!==null&&tab==='tanks'?tankDetail():({tanks:renderTanks,stock:renderStock,breeding:renderBreeding,tests:renderTests,maintenance:renderMaintenance,layout:renderLayout,commands:renderCommands,settings:renderSettings}[tab]());}
function go(t){tab=t;selected=null;render()};function openTank(id){selected=id;render()}
function saleCount(name){return db.tanks.reduce((sum,t)=>sum+(Number(t.saleCounts?.[name])||0),0)}
function renderStock(){let total=db.stockItems.reduce((a,x)=>a+saleCount(x.name)*(Number(x.price)||0),0);return `<div class="panel"><h2>💷 Fish Prices & Stock Value</h2><p class="hint">Only trade prices can be edited here. Quantities come from the saleable fish counts in each tank, excluding breeding pairs and other fish not for sale.</p><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th style="text-align:left;padding:9px 4px">Fish</th><th>Quantity / tanks</th><th>Each (£)</th><th style="text-align:right">Total</th></tr></thead><tbody>${db.stockItems.map((x,i)=>`<tr style="border-top:1px solid #d5e5ea"><td style="padding:10px 4px">${esc(x.name)}</td><td style="text-align:center">${saleCount(x.name)}<div class="hint" style="font-size:11px">${db.tanks.filter(t=>Number(t.saleCounts?.[x.name])>0).map(t=>`Tank ${t.id}: ${t.saleCounts[x.name]}`).join(" · ")||"—"}</div></td><td><input aria-label="Price of ${esc(x.name)}" type="number" min="0" step="0.01" style="min-width:72px;width:82px;padding:8px" value="${Number(x.price)||0}" onchange="changeStockPrice(${i},this.value)"></td><td style="text-align:right;white-space:nowrap">£${(saleCount(x.name)*(Number(x.price)||0)).toFixed(2)}</td></tr>`).join('')}</tbody></table></div><div class="row" style="margin-top:20px;border-top:2px solid #d5e5ea;padding-top:16px"><strong>Total Stock Value</strong><strong style="font-size:23px;color:#117f93">£${total.toFixed(2)}</strong></div><p class="hint">To change quantities, open the relevant tank and update its Saleable Stock Counts. The total updates automatically. Counts from old free-text notes cannot be imported reliably, so please enter them once in each tank.</p></div>`}
function changeStockPrice(i,value){let x=db.stockItems[i];if(!x)return;let n=Number(value);if(!Number.isFinite(n)||n<0){toast('Enter a valid price.');render();return}x.price=Math.round(n*100)/100;save();render()}
function saleCountEditor(t){return `<div class="panel" style="margin-top:12px"><h3>🐟 Saleable stock counts</h3><p class="hint">Enter fish and shrimp available for sale in this tank. Do not include breeding pairs. Use zero for species not in this tank. These numbers feed the Stock Value tab automatically.</p><div class="grid">${db.stockItems.map(x=>`<div><label>${esc(x.name)}</label><input type="number" min="0" step="1" data-sale-species="${esc(x.name)}" value="${Number(t.saleCounts?.[x.name])||0}"></div>`).join('')}</div><div class="actions"><button class="action" onclick="saveSaleCounts()">Save stock counts</button><button class="secondary" onclick="addSpecies()">+ Add species</button><button class="secondary" onclick="deleteSpecies()">Delete species</button></div></div>`}
function addSpecies(){let name=prompt('New fish or shrimp species name:');if(name===null)return;name=name.trim().replace(/\s+/g,' ');if(!name){toast('Enter a species name.');return}if(name.length>70){toast('Species name is too long.');return}if(db.stockItems.some(x=>x.name.toLowerCase()===name.toLowerCase())){toast('That species is already listed.');return}db.stockItems.push({name,price:0,qty:0});save();render();toast(name+' added. Set its trade price on Stock Value.');}
function deleteSpecies(){let name=prompt('Exact species name to delete from the stock list:');if(!name)return;let i=db.stockItems.findIndex(x=>x.name.toLowerCase()===name.trim().toLowerCase());if(i<0){toast('Species not found');return}if(!confirm('Delete '+db.stockItems[i].name+' and its stock counts from ALL tanks? This cannot be undone. Export a backup first.'))return;db.stockItems.splice(i,1);db.tanks.forEach(t=>delete t.saleCounts?.[name]);save();render();toast('Species deleted')}
function saveSaleCounts(){let t=db.tanks.find(x=>x.id===selected),counts={};for(let el of document.querySelectorAll('[data-sale-species]')){let n=Number(el.value);if(!Number.isInteger(n)||n<0){toast('Use whole numbers of zero or more.');return}if(n)counts[el.dataset.saleSpecies]=n;}t.saleCounts=counts;save();render();toast('Stock counts saved and valuation updated.');}
function renderTanks(){let active=db.tanks.filter(t=>t.status==='active').length,planned=db.tanks.filter(t=>t.status==='planned').length;let tiles=db.tanks.map(t=>`<button class="tank" onclick="openTank(${t.id})"><div class="tankhead"><span class="num">Tank ${t.id}</span><span class="tag ${t.status==='planned'?'off':t.status==='empty'?'warn':''}">${t.status==='planned'?'Planned':t.status==='empty'?'Empty':'In use'}</span></div><h3>${esc(t.name)}</h3><div class="sub">${esc(t.litres?t.litres+' litres':'Size not entered')}</div><div class="tank-water ${t.status==='active'?'':t.status==='empty'?'empty-water':'planned-water'}"></div><p>${esc(Object.entries(t.saleCounts||{}).filter(([k,v])=>Number(v)>0).map(([k,v])=>v+" × "+k).join(", ")||"No saleable fish counts entered")}</p></button>`);return `<div class="metrics"><div class="metric"><b>${db.tanks.length}</b><span>Total tanks</span></div><div class="metric"><b>${active}</b><span>In use</span></div><div class="metric"><b>${planned}</b><span>Not set up</span></div></div>${wcOverview()}<div class="overview-head"><h2>Your tanks</h2>${btn("+ Add tank","addTank()","action")}<p class="hint">Tap any tank to see or update its records. Grouped by tank number, not physical position.</p></div>${Array.from({length:Math.ceil(tiles.length/6)},(_,j)=>j*6).map((i,j)=>`<div class="rack-label">Tanks ${i+1}–${Math.min(i+6,db.tanks.length)}</div><div class="rack"><div class="tank-grid">${tiles.slice(i,i+6).join('')}</div><div class="rack-foot"></div></div>`).join('')}`}
function addTank(){let id=Math.max(0,...db.tanks.map(t=>t.id))+1;let name=prompt('Name or purpose for new Tank '+id,'Empty');if(name===null)return;db.tanks.push({id,name:name||'Empty',dimensions:'',litres:null,status:'empty',notes:'',saleCounts:{}});save();go('tanks');openTank(id)}
function deleteTank(id){let t=db.tanks.find(t=>t.id===id);if(!t)return;if(!confirm('Delete Tank '+id+'? Its maintenance, breeding, and test records will also be deleted. Export a backup first.'))return;if(!confirm('Confirm permanent deletion of Tank '+id+' and its records?'))return;db.tanks=db.tanks.filter(t=>t.id!==id);for(let k of ['tests','breeding','maintenance'])db[k]=db[k].filter(x=>+x.tank!==id);db.layout?.placements&&delete db.layout.placements[id];save();go('tanks')}
function tankDetail(){let t=db.tanks.find(x=>x.id===selected);return `<button class="back" onclick="selected=null;render()">← All tanks</button><div class="panel"><h2>Tank ${t.id} — ${esc(t.name)}</h2><div class="sub">${esc(t.dimensions||'Dimensions unknown')} ${t.litres?' • '+t.litres+' L gross':''}</div><label>Name / purpose</label><input id="tn" value="${esc(t.name)}"><label>Dimensions (mm)</label><input id="td" value="${esc(t.dimensions)}" placeholder="e.g. 300 × 300 × 300"><label>Gross litres (optional)</label><input id="tl" type="number" step="0.1" value="${t.litres??''}"><label>Status</label><select id="ts"><option value="active" ${t.status==='active'?'selected':''}>In use</option><option value="empty" ${t.status==='empty'?'selected':''}>Empty / set up</option><option value="planned" ${t.status==='planned'?'selected':''}>Not set up</option></select><label>Notes</label><textarea id="tno">${esc(t.notes)}</textarea><div class="actions">${btn('Save tank changes','saveTank()','action')}${btn('Add water test',`addForm('tests',${t.id})`)}${btn('Record breeding',`addForm('breeding',${t.id})`)}${btn('Delete tank',`deleteTank(${t.id})`)}</div></div>${saleCountEditor(t)}<div class="panel" style="margin-top:12px"><h3>Recent records</h3>${[...db.tests.filter(x=>+x.tank===t.id).map(x=>({...x,_type:'Water test'})),...db.breeding.filter(x=>+x.tank===t.id).map(x=>({...x,_type:'Breeding'})),...db.maintenance.filter(x=>+x.tank===t.id).map(x=>({...x,_type:'Maintenance'}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(x=>`<div class="listrow"><b>${esc(x._type)}</b> <span class="muted small">${esc(x.date||'Date unknown')}</span><div class="hint">${esc(x.type||x.action||[x.ammonia!==''?'Ammonia '+x.ammonia:'',x.nitrite!==''?'Nitrite '+x.nitrite:'',x.nitrate!==''?'Nitrate '+x.nitrate:''].filter(Boolean).join(' • '))} ${esc(x.notes)}</div></div>`).join('')||'<p class="empty">No records yet.</p>'}</div>`}
function saveTank(){let t=db.tanks.find(x=>x.id===selected);t.name=document.getElementById('tn').value;t.dimensions=document.getElementById('td').value;t.litres=document.getElementById('tl').value===''?null:+document.getElementById('tl').value;t.status=document.getElementById('ts').value;t.notes=document.getElementById('tno').value;save();render();say('Tank '+t.id+' saved.')}
function recordList(items,label){return items.map((x,i)=>({...x,_index:i})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div class="listrow"><div class="row"><b>Tank ${esc(x.tank)} • ${esc(x.type||x.action||label)}</b><span class="muted small">${esc(x.date||'Unknown date')}</span></div><div class="hint">${label==='Test'?`Ammonia ${esc(x.ammonia||'—')} • Nitrite ${esc(x.nitrite||'—')} • Nitrate ${esc(x.nitrate||'—')} • pH ${esc(x.ph||'—')} • High pH ${esc(x.highph||'—')}`:''} ${esc(x.notes||'')}</div>${btn("Delete",`deleteRecord('${label}',${x._index})`)}</div>`).join('')||'<div class="empty">No entries yet.</div>'}
function deleteRecord(label,i){let key={Breeding:'breeding',Test:'tests',Maintenance:'maintenance'}[label];if(!key||!db[key][i])return;if(!confirm('Delete this '+label.toLowerCase()+' record permanently?'))return;db[key].splice(i,1);save();render()}
function renderBreeding(){return `<div class="panel"><div class="row"><h2>Breeding history</h2>${btn('+ Record','addForm(\'breeding\')','action')}</div><p class="hint">Dates left blank when uncertain. Link parents and offspring in notes.</p>${recordList(db.breeding,'Breeding')}</div>`}
function renderTests(){return `<div class="panel"><div class="row"><h2>Water tests</h2>${btn('+ Add test','addForm(\'tests\')','action')}</div><p class="hint">API Freshwater Master Test Kit readings in ppm, except pH. For ammonia and nitrite, aim for 0 ppm; regularly monitor nitrate.</p>${recordList(db.tests,'Test')}</div>`}

function wcDays(id){const n=Number(db.settings?.waterChangeDays?.[id]);return Number.isInteger(n)&&n>=1&&n<=365?n:7}
function wcLast(id){return db.maintenance.filter(x=>Number(x.tank)===Number(id)&&String(x.action||'').trim().toLowerCase()==='water change'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')).map(x=>x.date).sort().pop()||null}
function wcNext(id){const d=wcLast(id);if(!d)return null;const dt=new Date(d+'T12:00:00Z');dt.setUTCDate(dt.getUTCDate()+wcDays(id));return dt.toISOString().slice(0,10)}
function wcState(id){const d=wcNext(id);if(!d)return 'No water change recorded';const diff=Math.round((Date.parse(d+'T12:00:00Z')-Date.parse(today()+'T12:00:00Z'))/86400000);return diff<0?'Overdue by '+(-diff)+' day(s) — '+d:diff===0?'Due today — '+d:diff<=2?'Due soon — '+d:'Next due: '+d}
function wcSave(id){const el=document.getElementById('wc_days_'+id);const n=Number(el.value);if(!Number.isInteger(n)||n<1||n>365){toast('Enter 1 to 365 whole days');return}db.settings??={};db.settings.waterChangeDays??={};db.settings.waterChangeDays[id]=n;save();render();toast('Tank '+id+' schedule saved')}
function wcOverview(){const active=db.tanks.filter(t=>t.status==='active');const due=active.filter(t=>wcNext(t.id)&&wcNext(t.id)<=today());const soon=active.filter(t=>{const d=wcNext(t.id);return d&&d>today()&&(Date.parse(d+'T12:00:00Z')-Date.parse(today()+'T12:00:00Z'))/86400000<=2});const missing=active.filter(t=>!wcNext(t.id));return `<div class="panel"><div class="row"><h2>💧 Water change reminders</h2>${btn('Change schedules',"go('maintenance')")}</div><p class="hint">${due.length} due/overdue • ${soon.length} due soon • ${missing.length} without a recorded change</p>${[...due,...soon].map(t=>`<div class="listrow"><b>Tank ${t.id} — ${esc(t.name)}</b><div class="hint">${wcState(t.id)}</div></div>`).join('')||'<p class="hint">No water changes due in the next 2 days.</p>'}<p class="hint">Reminders update when you open the app; they are not phone notifications.</p></div>`}
function renderMaintenance(){return `<div class="panel"><h2>💧 Water change schedules</h2><p class="hint">Default every 7 days. Change any tank independently. Due dates use the last logged water change.</p>${db.tanks.map(t=>`<div class="listrow"><b>Tank ${t.id} — ${esc(t.name)}</b><div class="row"><label for="wc_days_${t.id}">Every (days)</label><input style="max-width:100px" id="wc_days_${t.id}" type="number" min="1" max="365" step="1" value="${wcDays(t.id)}">${btn('Save',`wcSave(${t.id})`,'action')}</div><div class="hint">Last: ${wcLast(t.id)||'Not recorded'} • ${wcState(t.id)}</div></div>`).join('')}</div><div class="panel" style="margin-top:14px"><div class="row"><h2>Maintenance log</h2>${btn('+ Add task',"addForm('maintenance')",'action')}</div>${recordList(db.maintenance,'Maintenance')}</div>`}
function selectTank(id){return `<select id="formTank">${db.tanks.map(t=>`<option value="${t.id}" ${+id===t.id?'selected':''}>Tank ${t.id} – ${esc(t.name)}</option>`).join('')}</select>`}
function addForm(kind,id=1){tab=kind;selected=null;render();let root=document.getElementById('view');let fields=kind==='tests'?`<div class="two">${[['ammonia','Ammonia (ppm)'],['nitrite','Nitrite (ppm)'],['nitrate','Nitrate (ppm)'],['ph','pH'],['highph','High range pH']].map(([k,n])=>`<div><label>${n}</label><input id="f_${k}" type="number" min="0" step="any" placeholder="Optional"></div>`).join('')}</div>`:kind==='breeding'?`<label>Event</label><select id="f_type">${['Eggs laid','Wrigglers','Free swimming fry','Fry count','Successful batch','Unsuccessful batch','Other'].map(s=>`<option>${s}</option>`).join('')}</select>`:`<label>Task</label><select id="f_action">${['Water change','Cleaned tank','Filter maintenance','Fed','Other'].map(s=>`<option>${s}</option>`).join('')}</select>`;
root.insertAdjacentHTML('afterbegin',`<div class="panel" id="entry"><div class="row"><h2>New ${kind==='tests'?'water test':kind==='breeding'?'breeding entry':'maintenance entry'}</h2>${btn('Cancel','render()')}</div><label>Tank</label>${selectTank(id)}<label>Date (leave blank if unknown)</label><input id="f_date" type="date" value="${today()}">${fields}<label>Notes</label><textarea id="f_notes" placeholder="Additional details"></textarea><div class="actions">${btn('Save entry',`submitForm('${kind}')`,'action')}</div></div>`);document.getElementById('entry').scrollIntoView({behavior:'smooth'});}
function submitForm(kind){let item={tank:+document.getElementById('formTank').value,date:document.getElementById('f_date').value,notes:document.getElementById('f_notes').value};if(kind==='tests'){for(let k of ['ammonia','nitrite','nitrate','ph','highph'])item[k]=document.getElementById('f_'+k).value;}else if(kind==='breeding')item.type=document.getElementById('f_type').value;else item.action=document.getElementById('f_action').value;db[kind].push(item);save();render();say('Entry saved for tank '+item.tank+'.')}
function renderCommands(){return `<div class="panel"><h2>🎙️ Voice & typed commands</h2><p class="hint">Speak or type a command. You'll be asked to confirm before any record is saved.</p><label for="commandText">Your instruction</label><textarea id="commandText" placeholder="e.g. Record a water change for tank 6"></textarea><div class="actions"><button class="action" onclick="runTypedCommand()">➤ Process instruction</button><button class="secondary" onclick="voice()">🎙️ Speak instruction</button></div><p class="hint">Examples: “Record a water change for tank 6”, “12 fry counted in tank 8”, “Eggs laid in tank 11”. For other changes, use the tank's normal form.</p><p class="hint">On iPhone, you can also tap the microphone on your keyboard to dictate into the text box. Speech recognition support varies by browser.</p></div>`}
function runTypedCommand(){let s=document.getElementById('commandText')?.value.trim();if(!s){toast('Type an instruction first.');return}interpret(s)}
// Editable room layout; placements are per wall, in percentage coordinates.
const layoutWalls=['left','back','right'];
const defaultPlacements={1:{wall:'left',x:1,y:42,w:23},2:{wall:'left',x:26,y:42,w:23},3:{wall:'left',x:50,y:42,w:23},4:{wall:'left',x:75,y:42,w:23},9:{wall:'left',x:26,y:10,w:23},10:{wall:'left',x:50,y:10,w:23},11:{wall:'left',x:26,y:76,w:15},12:{wall:'left',x:42,y:76,w:15},13:{wall:'left',x:58,y:76,w:15},5:{wall:'back',x:3,y:12,w:23},6:{wall:'back',x:26,y:12,w:23},7:{wall:'back',x:49,y:12,w:23},8:{wall:'back',x:72,y:12,w:23},14:{wall:'back',x:3,y:58,w:92},15:{wall:'right',x:4,y:12,w:44},16:{wall:'right',x:49,y:12,w:44},17:{wall:'right',x:4,y:60,w:44},18:{wall:'right',x:49,y:60,w:44}};
let layoutWall='all',layoutEditing=false,dragLayout=null;
function ensureLayout(){db.layout??={};db.layout.placements??={};db.layout.racks??=[];db.layout.dividers??={};db.layout.rightWaterButt??=true;}
function positionFor(t){ensureLayout();return db.layout.placements[t.id]||defaultPlacements[t.id]||{wall:'right',x:4,y:10,w:40}}
function layoutColor(t){if(t.status!=='active')return '#9aafbb';let d=wcNext(t.id);if(!d)return '#2bbf79';let days=Math.ceil((Date.parse(d+'T12:00:00Z')-Date.parse(today()+'T12:00:00Z'))/86400000);return days<=1?'#ec4848':days<=3?'#efc334':'#2bbf79'}
function layoutWallHTML(w){let racks=db.layout.racks.filter(r=>r.wall===w).map(r=>`<div class="layout-beam ${r.kind==='vertical'?'vertical':''}" style="left:${r.x}%;top:${r.y}%;${r.kind==='vertical'?'height:'+r.length+'%;width:9px':'width:'+r.length+'%;height:9px'}" data-rack="${r.id}" title="Drag to reposition racking"></div>`).join('');let tanks=db.tanks.filter(t=>positionFor(t).wall===w).map(t=>{let a=positionFor(t),n=Number(db.layout.dividers[t.id])||0;return `<button class="layout-tank" style="left:${a.x}%;top:${a.y}%;width:${a.w}%;background:${layoutColor(t)}" data-tank="${t.id}" onclick="if(!layoutEditing){go('tanks');openTank(${t.id})}"><b>${t.id}</b>${n?`<span class="layout-dividers" style="background:repeating-linear-gradient(90deg,transparent 0,transparent calc(${100/(n+1)}% - 2px),#153647 calc(${100/(n+1)}% - 2px),#153647 ${100/(n+1)}%)"></span>`:''}</button>`}).join('');return `<div class="panel layout-panel"><h3>${w[0].toUpperCase()+w.slice(1)} wall</h3><div class="layout-canvas ${layoutEditing?'editing':''}" data-wall="${w}" onpointerdown="layoutPointerDown(event)">${racks}${tanks}${w==='right'&&db.layout.rightWaterButt?'<div class="layout-butt">💧<small>Water butt</small></div>':''}</div></div>`}
function renderLayout(){ensureLayout();return `<div class="panel"><h2>🗺️ Fish room — 2D layout</h2><p class="hint">Tap a tank to open its records. Colours: 🟢 more than 3 days, 🟡 2–3 days, 🔴 1 day or less, grey empty.</p><div class="actions">${['all',...layoutWalls].map(w=>btn(w==='all'?'All walls':w[0].toUpperCase()+w.slice(1)+' wall',`setLayoutWall('${w}')`,layoutWall===w?'action':'secondary')).join('')}</div><div class="actions">${btn(layoutEditing?'✓ Finish arranging':'✥ Arrange / drag & drop','toggleLayoutEdit()',layoutEditing?'action':'secondary')}</div>${layoutEditing?`<p class="hint">Drag tanks or rack pieces to reposition. Tap + Tank or + Beam / Leg to create one, then drag it into place. Drop onto the bin to delete (confirmation required). Use Resize / Dividers for dimensions.</p><div class="actions">${btn('+ Tank','addTankToLayout()','action')}${btn('+ Beam / Leg','addRack()','action')}${btn('Resize / dividers','editLayoutTank()')}${btn('Edit dividers','editDividers()')}</div><div class="layout-trash" id="layout-trash">🗑️ Drop here to delete a tank or rack piece</div>`:''}</div><div class="layout-grid">${(layoutWall==='all'?layoutWalls:[layoutWall]).map(layoutWallHTML).join('')}</div>`}
function toggleLayoutEdit(){layoutEditing=!layoutEditing;render()}
function layoutPointerDown(e){if(!layoutEditing)return;let el=e.target.closest('[data-tank],[data-rack]');if(!el)return;e.preventDefault();let canvas=el.closest('.layout-canvas');let rect=canvas.getBoundingClientRect();let kind=el.hasAttribute('data-tank')?'tank':'rack';let id=Number(el.dataset[kind]);let data=kind==='tank'?positionFor(db.tanks.find(t=>t.id===id)):db.layout.racks.find(r=>r.id===id);if(!data)return;dragLayout={el,canvas,kind,id,wall:canvas.dataset.wall,startX:e.clientX,startY:e.clientY,x:data.x,y:data.y,moved:false};el.setPointerCapture(e.pointerId);el.addEventListener('pointermove',layoutPointerMove);el.addEventListener('pointerup',layoutPointerUp);el.addEventListener('pointercancel',layoutPointerCancel)}
function layoutPointerMove(e){let d=dragLayout;if(!d||d.el!==e.currentTarget)return;let r=d.canvas.getBoundingClientRect();let dx=100*(e.clientX-d.startX)/r.width,dy=100*(e.clientY-d.startY)/r.height;if(Math.abs(e.clientX-d.startX)+Math.abs(e.clientY-d.startY)>5)d.moved=true;let w=d.kind==='tank'?Number(d.el.style.width.replace('%','')):2;d.el.style.left=Math.max(0,Math.min(100-w,d.x+dx))+'%';d.el.style.top=Math.max(0,Math.min(95,d.y+dy))+'%'}
function layoutPointerCancel(e){layoutPointerCleanup(e.currentTarget);render()}
function layoutPointerCleanup(el){el.removeEventListener('pointermove',layoutPointerMove);el.removeEventListener('pointerup',layoutPointerUp);el.removeEventListener('pointercancel',layoutPointerCancel);dragLayout=null}
function layoutPointerUp(e){let d=dragLayout;if(!d||d.el!==e.currentTarget)return;let trash=document.getElementById('layout-trash'),tr=trash?.getBoundingClientRect();let deleting=tr&&e.clientX>=tr.left&&e.clientX<=tr.right&&e.clientY>=tr.top&&e.clientY<=tr.bottom;let x=parseFloat(d.el.style.left),y=parseFloat(d.el.style.top);layoutPointerCleanup(e.currentTarget);if(deleting){if(d.kind==='tank')deleteTank(d.id);else if(confirm('Delete this racking piece?')){db.layout.racks=db.layout.racks.filter(r=>r.id!==d.id);save()}render();return}if(d.moved){if(d.kind==='tank'){let t=db.tanks.find(t=>t.id===d.id),a=positionFor(t);db.layout.placements[d.id]={...a,wall:d.wall,x,y}}else{let r=db.layout.racks.find(r=>r.id===d.id);if(r){r.x=x;r.y=y}}save()}render()}

function setLayoutWall(w){layoutWall=w;render()}
function tankChoice(message){let v=prompt(message+'\nAvailable: '+db.tanks.map(t=>t.id).join(', '));if(v===null)return null;let id=Number(v);if(!db.tanks.some(t=>t.id===id)){toast('Tank not found');return null}return id}
function addTankToLayout(){addTank();if(selected!==null){let id=selected;go('layout');setTankPlacement(id)}}
function editLayoutTank(){let id=tankChoice('Tank number to position or resize:');if(id!==null)setTankPlacement(id)}
function setTankPlacement(id){let a=positionFor(db.tanks.find(t=>t.id===id));let wall=prompt('Wall: left, back or right',a.wall);if(wall===null)return;wall=wall.toLowerCase().trim();if(!layoutWalls.includes(wall)){toast('Choose left, back or right');return}let x=prompt('Horizontal position % (0–95)',a.x);if(x===null)return;let y=prompt('Vertical position % (0–90)',a.y);if(y===null)return;let w=prompt('Tank width % (5–95)',a.w);if(w===null)return;let vals=[x,y,w].map(Number);if(vals.some(n=>!Number.isFinite(n))||vals[0]<0||vals[1]<0||vals[0]>95||vals[1]>90||vals[2]<5||vals[2]>95){toast('Invalid position or width');return}db.layout.placements[id]={wall,x:vals[0],y:vals[1],w:Math.min(vals[2],100-vals[0])};save();go('layout')}
function deleteLayoutTank(){let id=tankChoice('Tank number to delete:');if(id!==null)deleteTank(id)}
function editDividers(){let id=tankChoice('Tank number to change dividers:');if(id===null)return;let v=prompt('Number of internal dividers (0–10)',db.layout.dividers[id]||0);if(v===null)return;let n=Number(v);if(!Number.isInteger(n)||n<0||n>10){toast('Enter 0 to 10');return}db.layout.dividers[id]=n;save();render()}
function addRack(){ensureLayout();let wall=prompt('Wall for new beam or leg: left, back, right',layoutWall==='all'?'left':layoutWall);if(wall===null)return;wall=wall.trim().toLowerCase();if(!layoutWalls.includes(wall)){toast('Invalid wall');return}let kind=prompt('Type: horizontal or vertical','horizontal');if(kind===null)return;kind=kind.trim().toLowerCase();if(!['horizontal','vertical'].includes(kind)){toast('Invalid type');return}let x=prompt('Start position from left (%)','10');if(x===null)return;let y=prompt('Start position from top (%)','50');if(y===null)return;let length=prompt('Length as % of wall','60');if(length===null)return;let a=[x,y,length].map(Number);if(a.some(n=>!Number.isFinite(n)||n<0||n>100)||a[2]===0){toast('Invalid dimensions');return}db.layout.racks.push({id:Date.now()+Math.floor(Math.random()*10000),wall,kind,x:a[0],y:a[1],length:Math.min(a[2],100-(kind==='horizontal'?a[0]:a[1]))});save();render()}
function editRack(id){let r=db.layout.racks.find(x=>x.id===id);if(!r)return;let choice=prompt('Racking '+r.kind+' on '+r.wall+' wall. Enter MOVE or DELETE','MOVE');if(!choice)return;if(choice.toUpperCase()==='DELETE'){if(confirm('Remove this beam or leg?')){db.layout.racks=db.layout.racks.filter(x=>x.id!==id);save();render()}return}if(choice.toUpperCase()!=='MOVE')return;let x=prompt('Left position (%)',r.x),y=x===null?null:prompt('Top position (%)',r.y),length=y===null?null:prompt('Length (%)',r.length);if(length===null)return;let a=[x,y,length].map(Number);if(a.some(n=>!Number.isFinite(n)||n<0||n>100)||a[2]===0){toast('Invalid dimensions');return}[r.x,r.y,r.length]=a;save();render()}
function removeRack(){if(!db.layout.racks.length){toast('No added racking to remove');return}let rows=db.layout.racks.map((r,i)=>`${i+1}: ${r.wall} ${r.kind}`).join('\n');let n=Number(prompt('Which racking piece?\n'+rows));if(n>=1&&n<=db.layout.racks.length)editRack(db.layout.racks[n-1].id)}
function moveRack(){removeRack()}
function renderSettings(){let r=db.reservoir;return `<div class="panel"><h2>Voice preferences</h2><label style="display:flex;align-items:center;gap:10px;font-size:15px"><input style="width:20px;height:20px" type="checkbox" id="reply" ${db.settings.voiceReply?'checked':''} onchange="db.settings.voiceReply=this.checked;save()">Speak responses aloud</label><p class="hint">Tap 🎙️ to dictate. Voice recognition depends on the browser/device and may not work when this file is opened locally. You can always type.</p></div><div class="panel" style="margin-top:12px"><h2>Water butt</h2><p>Approx. ${r.capacity} L maximum • ${r.volume} L current estimate</p><p class="hint">${esc(r.notes)}</p><label>Current water depth (mm)</label><input id="depth" type="number" value="${r.level}"><div class="actions">${btn('Update level','updateLevel()','action')}</div></div><div class="panel" style="margin-top:12px"><h2>Backups and data</h2><p class="hint">Data is stored on this device and in this browser only. Download regular backups; losing browser data or deleting this file may lose local records. Cloud sync and account sign-in are NOT enabled in this version.</p><div class="actions">${btn('⬇ Export backup','exportBackup()','action')}<label class="secondary" style="margin:0;cursor:pointer">⬆ Restore backup <input style="display:none" type="file" accept="application/json,.json" onchange="importBackup(event)"></label></div><p class="hint">To move devices: export a JSON backup and restore it on the other device. Keep backup files somewhere safe such as iCloud Drive.</p></div>`}
function updateLevel(){let d=+document.getElementById('depth').value,r=db.reservoir;r.level=Math.max(0,Math.min(r.height,d));r.volume=Math.round(r.capacity*r.level/r.height);save();render();say('Estimated water volume '+r.volume+' litres.')}
function exportBackup(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fishroom-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Backup created. Save it somewhere safe.')}
async function importBackup(e){let f=e.target.files?.[0];if(!f)return;try{let val=JSON.parse(await f.text());if(!Array.isArray(val.tanks)||!Array.isArray(val.tests)||!Array.isArray(val.breeding)||!Array.isArray(val.maintenance))throw Error('Invalid backup');if(!confirm('Replace current app records with this backup?'))return;db=val;db.settings??={voiceReply:true};db.reservoir??=initial().reservoir;if(!Array.isArray(db.stockItems))db.stockItems=stockDefaults.map(([name,price])=>({name,price,qty:0}));db.tanks.forEach(t=>{t.saleCounts??={};});save();go('tanks');say('Backup restored.')}catch(err){toast('Could not restore: '+err.message)}}
let recognition=null;function voice(){if(!window.isSecureContext){toast('Microphone needs an HTTPS page. You can still type commands.');return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Voice dictation is not supported here. Use your phone keyboard microphone, or type into a form.');return}try{recognition=new SR();recognition.lang='en-GB';recognition.interimResults=false;recognition.onresult=e=>{let s=e.results[0][0].transcript;go('commands');document.getElementById('commandText').value=s;interpret(s)};recognition.onerror=e=>toast('Microphone error: '+e.error);recognition.onend=()=>document.getElementById('mic').classList.remove('on');recognition.start();document.getElementById('mic').classList.add('on')}catch(e){toast('Cannot start microphone: '+e.message)}}
function interpret(s){let m=s.match(/tank\s*(\d+)/i),n=m?+m[1]:null;if(!n||!db.tanks.some(t=>t.id===n)){say('I heard '+s+'. Please say the tank number too, or enter it manually.');return}let t=db.tanks.find(x=>x.id===n);let ct=s.match(/(?:count(?:ed)?|there (?:are|is)|have)\s*(\d+)\s*(?:baby |juvenile |young )?(?:bristle|pleco|fry|fish)/i)||s.match(/(\d+)\s*(?:baby |juvenile )?(?:bristlenose|plecos|fry)/i);if(ct){let qty=+ct[1];if(confirm('Update Tank '+n+' livestock count to '+qty+' based on: “'+s+'”?')){t.notes=(t.notes?t.notes+'\n':'')+today()+': Voice count '+qty+' — '+s;db.breeding.push({tank:n,date:today(),type:'Fry count',notes:qty+' counted. Voice entry: '+s});save();render();say('Tank '+n+' count logged as '+qty+'.')}return}if(/water change/i.test(s)){if(confirm('Record water change for Tank '+n+' today?')){db.maintenance.push({tank:n,date:today(),action:'Water change',notes:s});save();render();say('Water change logged for Tank '+n+'.')}return}if(/eggs|laid|spawn/i.test(s)){if(confirm('Record breeding event for Tank '+n+' today?')){db.breeding.push({tank:n,date:today(),type:'Eggs laid',notes:s});save();render();say('Breeding event recorded for Tank '+n+'.')}return}say('I heard '+s+'. I cannot safely work out what to update. Please use the tank form instead.');}
document.getElementById('mic').onclick=voice;render();save();
</script><script id="fish-lock-script">(function(){const gate=document.getElementById('fish-lock');const form=document.getElementById('fish-lock-form');const field=document.getElementById('fish-lock-password');const error=document.getElementById('fish-lock-error');const expected=[69,115,109,101,49,50,51,33];if(sessionStorage.getItem('fishroom-unlocked')==='yes'){gate.remove();return;}document.body.style.overflow='hidden';document.querySelector('main.shell').setAttribute('inert','');document.getElementById('mic').setAttribute('inert','');form.addEventListener('submit',function(e){e.preventDefault();const entered=Array.from(field.value).map(c=>c.charCodeAt(0));if(entered.length===expected.length&&entered.every((x,i)=>x===expected[i])){sessionStorage.setItem('fishroom-unlocked','yes');gate.remove();document.body.style.overflow='';document.querySelector('main.shell').removeAttribute('inert');document.getElementById('mic').removeAttribute('inert');}else{error.textContent='Incorrect password. Try again.';field.value='';field.focus();}});})();</script></body></html>
